<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlaxonStudio MCPE - Minecraft Mods</title>
    <link rel="stylesheet" href="https://mc-style.netlify.app/FlaxonStyle.css">
    <script src="https://kit.fontawesome.com/21dfbfd306.js" crossorigin="anonymous"></script>
    <meta property="og:title" content="Flaxon Studio">
    <meta property="og:description" content="Flaxon Studio is your ultimate destination for high-quality Minecraft PE mods, crafted with care and style. Discover, explore, and enhance your MCPE experience.">
    <meta property="og:image" content="https://flaxon-studio.mcpe.site/Axolotl.png">
    <meta property="og:url" content="https://flaxon-studio.mcpe.site/">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="https://flaxon-studio.mcpe.site/Axolotl.png">

    <style>
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: -1;
            top: 0;
            left: 0;
            overflow: hidden;
        }
        
        .pixel-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #55ff55;
            animation: pixelFloat 8s infinite linear;
            box-shadow: 0 0 8px rgba(85, 255, 85, 0.5);
        }
        
        .pixel-particle:nth-child(even) {
            background: #5555ff;
            box-shadow: 0 0 8px rgba(85, 85, 255, 0.5);
        }
        
        .pixel-particle:nth-child(3n) {
            background: #ff5555;
            box-shadow: 0 0 8px rgba(255, 85, 85, 0.5);
        }
        
        @keyframes pixelFloat {
            0% {
                transform: translateY(100vh) translateX(0px) rotate(0deg);
                opacity: 1;
            }
            25% {
                transform: translateY(75vh) translateX(20px) rotate(90deg);
                opacity: 0.8;
            }
            50% {
                transform: translateY(50vh) translateX(-20px) rotate(180deg);
                opacity: 0.6;
            }
            75% {
                transform: translateY(25vh) translateX(30px) rotate(270deg);
                opacity: 0.4;
            }
            100% {
                transform: translateY(-10vh) translateX(0px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .main-container {
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }
        
        .header {
            background: rgba(42, 42, 42, 0.95);
            padding: 30px 0;
            text-align: center;
            border-bottom: 6px solid #555555;
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            font-size: 56px;
            color: #55ff55;
            text-shadow: 4px 4px 0px #005500;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .logo i {
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 60%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            80% {
                transform: translateY(-5px);
            }
        }
        
        .subtitle {
            color: #aaaaaa;
            font-size: 20px;
            margin-bottom: 20px;
        }
        
        .api-info {
            background: rgba(51, 51, 51, 0.8);
            border: 2px solid #555555;
            padding: 15px;
            margin: 20px auto;
            max-width: 800px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        
        .api-title {
            color: #55ff55;
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .api-url {
            background: rgba(68, 68, 68, 0.9);
            padding: 10px;
            border: 2px solid #777777;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            border-radius: 4px;
            margin: 5px 0;
        }
        
        .search-container {
            max-width: 700px;
            margin: 40px auto;
            position: relative;
            padding: 0 20px;
        }
        
        .search-box {
            display: flex;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .search-input {
            flex: 1;
            padding: 18px 25px;
            background-color: rgba(51, 51, 51, 0.95);
            border: 4px solid #555555;
            color: #ffffff;
            font-family: 'Minecraft', sans-serif;
            font-size: 18px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border-radius: 8px;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #55ff55;
            box-shadow: 0 0 25px rgba(85, 255, 85, 0.4);
            transform: scale(1.02);
        }
        
        .search-btn {
            padding: 18px 30px;
            background-color: #55ff55;
            color: #000000;
            border: none;
            font-family: 'Minecraft', sans-serif;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-btn:hover {
            background-color: #7dff7d;
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(85, 255, 85, 0.3);
        }
        
        .mods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 35px;
            padding: 50px 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .mod-card {
            background: rgba(42, 42, 42, 0.95);
            border: 5px solid #555555;
            padding: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(15px);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .mod-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border-color: #55ff55;
        }
        
        .mod-card:hover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(85, 255, 85, 0.1), rgba(85, 85, 255, 0.1));
            pointer-events: none;
            z-index: 1;
        }
        
        .mod-image-container {
            position: relative;
            overflow: hidden;
        }
        
        .mod-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 4px solid #555555;
            transition: transform 0.4s ease;
        }
        
        .mod-card:hover .mod-image {
            transform: scale(1.1);
        }
        
        .mod-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            background: rgba(42, 42, 42, 0.9);
            border: 3px solid #555555;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #55ff55;
            backdrop-filter: blur(10px);
            z-index: 2;
        }
        
        .mod-content {
            padding: 25px;
            position: relative;
            z-index: 2;
        }
        
        .mod-title {
            color: #55ff55;
            font-size: 24px;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0px #005500;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .mod-description {
            color: #cccccc;
            line-height: 1.8;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 16px;
        }
        
        .mod-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .mod-version, .mod-category {
            background: rgba(51, 51, 51, 0.8);
            padding: 8px 12px;
            border: 2px solid #555555;
            border-radius: 6px;
            font-size: 14px;
            color: #aaaaaa;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .mod-actions {
            display: flex;
            gap: 12px;
        }
        
        .show-btn, .download-btn {
            flex: 1;
            padding: 15px;
            font-family: 'Minecraft', sans-serif;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 8px;
            font-weight: bold;
        }
        
        .show-btn {
            background-color: #5555ff;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(85, 85, 255, 0.3);
        }
        
        .show-btn:hover {
            background-color: #7d7dff;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(85, 85, 255, 0.4);
        }
        
        .download-btn {
            background-color: #55ff55;
            color: #000000;
            box-shadow: 0 4px 15px rgba(85, 255, 85, 0.3);
        }
        
        .download-btn:hover {
            background-color: #7dff7d;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(85, 255, 85, 0.4);
        }
        
        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: #aaaaaa;
            font-size: 20px;
        }
        
        .no-results i {
            font-size: 64px;
            margin-bottom: 25px;
            display: block;
            color: #555555;
            animation: pulse 2s infinite;
        }
        
        .mod-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            animation: modalFadeIn 0.3s ease;
        }
        
        .mod-modal.active {
            display: flex;
        }
        
        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .modal-content {
            background: rgba(42, 42, 42, 0.98);
            border: 5px solid #555555;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            backdrop-filter: blur(15px);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            animation: modalSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px) scale(0.9);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        
        .modal-header {
            padding: 25px;
            background: rgba(51, 51, 51, 0.95);
            border-bottom: 4px solid #555555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            color: #55ff55;
            font-size: 28px;
            text-shadow: 3px 3px 0px #005500;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .close-btn {
            background: rgba(68, 68, 68, 0.8);
            border: 2px solid #555555;
            color: #aaaaaa;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        
        .close-btn:hover {
            color: #ff5555;
            transform: scale(1.2);
            background: rgba(255, 85, 85, 0.2);
        }
        
        .modal-body {
            padding: 30px;
        }
        
        .modal-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border: 4px solid #555555;
            margin-bottom: 25px;
            border-radius: 8px;
        }
        
        .modal-description {
            color: #cccccc;
            line-height: 2;
            margin-bottom: 25px;
            font-size: 18px;
        }
        
        .modal-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .meta-item {
            background: rgba(51, 51, 51, 0.8);
            padding: 15px;
            border: 2px solid #555555;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .meta-item i {
            color: #55ff55;
            font-size: 20px;
        }
        
        .meta-label {
            color: #aaaaaa;
            font-size: 14px;
        }
        
        .meta-value {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
        }
        
        .modal-url {
            background: rgba(68, 68, 68, 0.9);
            padding: 15px;
            border: 2px solid #777777;
            color: #55ff55;
            font-family: 'Courier New', monospace;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .modal-download {
            width: 100%;
            padding: 20px;
            background-color: #55ff55;
            color: #000000;
            border: none;
            font-family: 'Minecraft', sans-serif;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(85, 255, 85, 0.3);
        }
        
        .modal-download:hover {
            background-color: #7dff7d;
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(85, 255, 85, 0.4);
        }
        
        @media (max-width: 768px) {
            .logo {
                font-size: 42px;
            }
            
            .mods-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 25px;
                padding: 30px 15px;
            }
            
            .modal-content {
                width: 95%;
                margin: 10px;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .search-btn {
                width: 100%;
            }
            
            .api-info {
                margin: 15px;
            }
            
            .modal-meta {
                grid-template-columns: 1fr;
            }
        }
        
        .page-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #55ff55, #5555ff);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }
        
        .page-transition.active {
            transform: translateX(0);
        }
        
        .transition-content {
            text-align: center;
            color: #000000;
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    
    <div class="page-transition">
        <div class="transition-content">
            <i class="fas fa-cube fa-spin"></i>
            <div>Loading Mod...</div>
        </div>
    </div>
    
    <div class="main-container">
        <header class="header">
            <h1 class="logo">
                <i class="fas fa-cube"></i>
                FlaxonStudio MCPE
            </h1>
            <p class="subtitle">Your Ultimate Minecraft PE Mods Collection</p>
            
            <div class="api-info">
                <div class="api-title">
                    <i class="fas fa-code"></i>
                    API Endpoint
                </div>
                <div class="api-url">
                    GET http://flaxon-studio.mcpe.site/data.json
                </div>
                <div style="color: #aaaaaa; font-size: 14px; margin-top: 10px;">
                    Returns JSON array with all mods data (name, description, page_url)
                </div>
            </div>
        </header>
        
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Search for mods...">
                <button class="search-btn" onclick="searchMods()">
                    <i class="fas fa-search"></i>
                    Search
                </button>
            </div>
        </div>
        
        <div id="modsGrid" class="mods-grid"></div>
        
        <div id="noResults" class="no-results" style="display: none;">
            <i class="fas fa-search"></i>
            <h3>No Mods Found</h3>
            <p>Sorry, we couldn't find any mods matching your search.</p>
        </div>
    </div>
    
    <div id="modModal" class="mod-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title"></h2>
                <button class="close-btn" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <img id="modalImage" class="modal-image" src="" alt="">
                <p id="modalDescription" class="modal-description"></p>
                
                <div class="modal-meta" id="modalMeta"></div>
                
                <div id="modalUrl" class="modal-url"></div>
                
                <button id="modalDownload" class="modal-download">
                    <i class="fas fa-download"></i>
                    Download Mod
                </button>
            </div>
        </div>
    </div>

    <script>
    let modsData = [];
    let filteredMods = [];
    let currentModId = null;
    
    const modIcons = {
        'Lucky Block': 'fas fa-dice',
        'Furniture': 'fas fa-chair',
        'Cars': 'fas fa-car',
        'Weapons': 'fas fa-sword',
        'Animals': 'fas fa-paw',
        'Magic': 'fas fa-magic',
        'Tools': 'fas fa-tools',
        'Food': 'fas fa-apple-alt',
        'Building': 'fas fa-cubes',
        'Adventure': 'fas fa-compass'
    };

    // Cache system
    const modsCache = {
        data: null,
        timestamp: null,
        get: function() {
            if (this.data && this.timestamp && (Date.now() - this.timestamp) < 300000) {
                return Promise.resolve(this.data);
            }
            return null;
        },
        set: function(data) {
            this.data = data;
            this.timestamp = Date.now();
        }
    };

    async function loadMods() {
        const cachedData = modsCache.get();
        if (cachedData) {
            modsData = cachedData;
            filteredMods = modsData;
            displayMods();
            return;
        }

        try {
            const response = await fetch('data.json', {
                cache: 'force-cache'
            });
            modsData = await response.json();
            modsCache.set(modsData);
            filteredMods = modsData;
            displayMods();
        } catch (error) {
            console.log('Using sample data');
            modsData = modsData;
            filteredMods = modsData;
            displayMods();
        }
    }
    
    function getModIcon(modName, category) {
        for (let key in modIcons) {
            if (modName.toLowerCase().includes(key.toLowerCase())) {
                return modIcons[key];
            }
        }
        return modIcons[category] || 'fas fa-cube';
    }
    
    function displayMods() {
        const modsGrid = document.getElementById('modsGrid');
        const noResults = document.getElementById('noResults');
        
        if (filteredMods.length === 0) {
            modsGrid.style.display = 'none';
            noResults.style.display = 'block';
            return;
        }
        
        modsGrid.style.display = 'grid';
        noResults.style.display = 'none';
        
        modsGrid.innerHTML = filteredMods.map(mod => `
            <div class="mod-card" data-id="${mod.id}">
                <div class="mod-image-container">
                    <img src="${mod.image}" alt="${mod.name}" class="mod-image" loading="lazy">
                    <div class="mod-icon">
                        <i class="${getModIcon(mod.name, mod.category)}"></i>
                    </div>
                </div>
                <div class="mod-content">
                    <h3 class="mod-title">
                        <i class="${getModIcon(mod.name, mod.category)}"></i>
                        ${mod.name}
                    </h3>
                    <p class="mod-description">${mod.description}</p>
                    <div class="mod-meta">
                        <div class="mod-version">
                            <i class="fas fa-code-branch"></i>
                            ${mod.version}
                        </div>
                        <div class="mod-category">
                            <i class="fas fa-tag"></i>
                            ${mod.category}
                        </div>
                    </div>
                    <div class="mod-actions">
                        <button class="show-btn" onclick="showMod(${mod.id})">
                            <i class="fas fa-eye"></i>
                            Show Page
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }
    
    function searchMods() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        
        if (searchTerm === '') {
            filteredMods = modsData;
        } else {
            filteredMods = modsData.filter(mod => 
                mod.name.toLowerCase().includes(searchTerm) ||
                mod.description.toLowerCase().includes(searchTerm) ||
                mod.category.toLowerCase().includes(searchTerm)
            );
        }
        
        displayMods();
    }
    
    function showModTransition(callback) {
        const transition = document.querySelector('.page-transition');
        transition.classList.add('active');
        
        setTimeout(() => {
            callback();
            setTimeout(() => {
                transition.classList.remove('active');
            }, 300);
        }, 250);
    }
    
    function showMod(modId) {
        currentModId = modId;
        showModTransition(() => {
            const mod = modsData.find(m => m.id === modId);
            if (!mod) return;
            
            const modUrl = `SOON`;
            
            document.getElementById('modalTitle').innerHTML = `
                <i class="${getModIcon(mod.name, mod.category)}"></i>
                ${mod.name}
            `;
            document.getElementById('modalImage').src = mod.image;
            document.getElementById('modalDescription').textContent = mod.description;
            
            const modalMeta = document.getElementById('modalMeta');
            modalMeta.innerHTML = `
                <div class="meta-item">
                    <i class="fas fa-code-branch"></i>
                    <div>
                        <div class="meta-label">Version</div>
                        <div class="meta-value">${mod.version}</div>
                    </div>
                </div>
                <div class="meta-item">
                    <i class="fas fa-tag"></i>
                    <div>
                        <div class="meta-label">Category</div>
                        <div class="meta-value">${mod.category}</div>
                    </div>
                </div>
                <div class="meta-item">
                    <i class="fas fa-user"></i>
                    <div>
                        <div class="meta-label">Author</div>
                        <div class="meta-value">${mod.author}</div>
                    </div>
                </div>
                <div class="meta-item">
                    <i class="fas fa-database"></i>
                    <div>
                        <div class="meta-label">File Size</div>
                        <div class="meta-value">${mod.fileSize}</div>
                    </div>
                </div>
            `;
            
            const versionsList = mod.supportedVersions.map(v => `v${v}`).join(', ');
            modalMeta.innerHTML += `
                <div class="meta-item">
                    <i class="fas fa-check-circle"></i>
                    <div>
                        <div class="meta-label">Supported Versions</div>
                        <div class="meta-value">${versionsList}</div>
                    </div>
                </div>
            `;
            
            document.getElementById('modalUrl').innerHTML = `
                <i class="fas fa-link"></i>
                ${modUrl}
            `;
            
            const downloadContainer = document.getElementById('modalDownload');
            downloadContainer.innerHTML = '';
            
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'modal-download';
            downloadBtn.style.width = '100%';
            downloadBtn.innerHTML = `
                <i class="fas fa-download"></i>
                Download File
            `;
            downloadBtn.onclick = () => showDownloadPage(mod);
            downloadContainer.appendChild(downloadBtn);
            
            document.getElementById('modModal').classList.add('active');
        });
    }
    
    function showDownloadPage(mod) {
        const mainModal = document.getElementById('modModal');
        mainModal.classList.remove('active');
        
        const downloadModal = document.createElement('div');
        downloadModal.className = 'mod-modal active';
        downloadModal.innerHTML = `
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">
                        <i class="${getModIcon(mod.name, mod.category)}"></i>
                        Download ${mod.name}
                    </h2>
                    <button class="close-btn" onclick="backToModPage()">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="download-buttons-container" id="downloadButtons"></div>
                </div>
            </div>
        `;
        
        document.body.appendChild(downloadModal);
        
        const downloadButtons = downloadModal.querySelector('#downloadButtons');
        
        if (Array.isArray(mod.downloadUrl)) {
            mod.downloadUrl.forEach((url, index) => {
                const fileName = decodeURIComponent(url.split('/').pop() || `mod-part-${index+1}.mcpack`);
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'modal-download';
                downloadBtn.innerHTML = `
                    <i class="fas fa-download"></i>
                    ${fileName}
                `;
                downloadBtn.onclick = () => downloadMod(url, fileName);
                downloadButtons.appendChild(downloadBtn);
            });
        } else {
            const fileName = decodeURIComponent(mod.downloadUrl.split('/').pop() || `${mod.name.toLowerCase().replace(/ /g, '-')}.mcpack`);
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'modal-download';
            downloadBtn.innerHTML = `
                <i class="fas fa-download"></i>
                ${fileName}
            `;
            downloadBtn.onclick = () => downloadMod(mod.downloadUrl, fileName);
            downloadButtons.appendChild(downloadBtn);
        }
    }
    
    function backToModPage() {
        const downloadModal = document.querySelector('.mod-modal.active');
        if (downloadModal) {
            downloadModal.remove();
        }
        document.getElementById('modModal').classList.add('active');
    }
    
    function closeModal() {
        document.getElementById('modModal').classList.remove('active');
        const downloadModal = document.querySelector('.mod-modal.active');
        if (downloadModal) {
            downloadModal.remove();
        }
    }
    
    function downloadMod(url, name) {
        const link = document.createElement('a');
        link.href = url;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    function createParticles() {
        const particlesContainer = document.getElementById('particles-js');
        const particleCount = Math.floor(window.innerWidth / 10);
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('pixel-particle');
            
            particle.style.left = Math.random() * window.innerWidth + 'px';
            particle.style.top = Math.random() * window.innerHeight + 'px';
            particle.style.animationDelay = Math.random() * 8 + 's';
            particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
            
            particlesContainer.appendChild(particle);
        }
    }
    
    // Event delegation for mod cards
    document.addEventListener('click', function(e) {
        if (e.target.closest('.mod-card')) {
            const modId = parseInt(e.target.closest('.mod-card').dataset.id);
            if (modId) {
                showMod(modId);
            }
        }
    });
    
    document.getElementById('searchInput').addEventListener('input', debounce(searchMods, 300));
    
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeModal();
        }
    });
    
    // Debounce function for better performance
    function debounce(func, delay) {
        let timeout;
        return function() {
            const context = this;
            const args = arguments;
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(context, args), delay);
        };
    }
    
    // Lazy load images
    document.addEventListener('DOMContentLoaded', function() {
        if ('IntersectionObserver' in window) {
            const lazyImages = document.querySelectorAll('.mod-image[loading="lazy"]');
            
            const imageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src || img.src;
                        imageObserver.unobserve(img);
                    }
                });
            });
            
            lazyImages.forEach(img => imageObserver.observe(img));
        }
    });
    
    window.addEventListener('load', function() {
        loadMods();
        createParticles();
    });
</script>
</body>
</html>
